<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="author" content="JackFrozt">
<title>HMA VOUCHER TIME CHECK</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; -webkit-tap-highlight-color:transparent; }

html, body {
    width:100%;
    min-height:100vh;
    background:#000;
    color:#00ff88;
    padding:15px;
    padding-bottom:60px;
    overflow-x:hidden;
    position:relative;
}

/* ==================== MATRIX CANVAS ==================== */
#matrix {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
    background:#000;
}

/* ==================== GRID OVERLAY ==================== */
.grid-overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
    background-image:
        linear-gradient(rgba(0,255,136,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.07) 1px, transparent 1px);
    background-size:45px 45px;
    pointer-events:none;
    animation:gridPulse 4s ease-in-out infinite;
}
@keyframes gridPulse {
    0%, 100% { opacity:0.6; }
    50% { opacity:1; }
}

/* ==================== PARTICLES ==================== */
.particle {
    position:fixed;
    width:4px;
    height:4px;
    background:#00ff88;
    border-radius:50%;
    box-shadow:0 0 15px #00ff88, 0 0 25px #00ff88;
    pointer-events:none;
    z-index:0;
    animation:floatUp linear infinite;
    opacity:0.6;
}
@keyframes floatUp {
    0% { transform:translateY(100vh) scale(0); opacity:0; }
    10% { opacity:1; transform:translateY(90vh) scale(1); }
    90% { opacity:1; }
    100% { transform:translateY(-10vh) scale(0.5); opacity:0; }
}

/* ==================== APP ==================== */
.app {
    max-width:480px;
    margin:0 auto;
    position:relative;
    z-index:1;
}

/* ==================== HEADER ==================== */
.header {
    text-align:center;
    margin-bottom:25px;
    padding-top:15px;
}
.header h1 {
    font-size:30px;
    background:linear-gradient(135deg,#00ff88,#00ffcc,#aaffdd);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:8px;
    letter-spacing:3px;
    font-weight:900;
    animation:titleShine 3s linear infinite;
    filter:drop-shadow(0 0 20px #00ff88);
}
@keyframes titleShine {
    to { background-position:200% center; }
}
.header p {
    font-size:13px;
    color:#66aa88;
    letter-spacing:2px;
    margin-bottom:5px;
}
.header .owner {
    font-size:13px;
    color:#aa66ff;
    letter-spacing:1.5px;
    text-shadow:0 0 15px rgba(170,102,255,0.8);
    font-weight:bold;
}

/* ==================== STAT CARD ==================== */
.stat-card {
    background:rgba(0,20,10,0.7);
    border:2px solid rgba(0,255,136,0.5);
    border-radius:15px;
    padding:14px;
    text-align:center;
    margin-bottom:15px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,255,136,0.3), inset 0 0 30px rgba(0,255,136,0.05);
    transition:0.3s;
}
.stat-card .stat-label {
    font-size:10px;
    color:#66aa88;
    letter-spacing:2px;
    margin-bottom:5px;
    text-transform:uppercase;
}
.stat-card .stat-value {
    font-size:17px;
    font-weight:900;
    color:#00ff88;
    text-shadow:0 0 20px rgba(0,255,136,0.8);
}
.stat-card.online {
    border-color:rgba(0,255,136,0.8);
    box-shadow:0 0 40px rgba(0,255,136,0.5), inset 0 0 30px rgba(0,255,136,0.1);
}
.stat-card.online .stat-value {
    color:#00ff88;
}
.stat-card.offline {
    border-color:rgba(255,51,68,0.6);
    box-shadow:0 0 30px rgba(255,51,68,0.3);
}
.stat-card.offline .stat-value {
    color:#ff3344;
    text-shadow:0 0 20px rgba(255,51,68,0.8);
}
/* ==================== CARD ==================== */
.card {
    background:rgba(0,20,10,0.7);
    border:2px solid rgba(0,255,136,0.5);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,255,136,0.3), inset 0 0 30px rgba(0,255,136,0.05);
    transition:0.3s;
    position:relative;
    overflow:hidden;
}
.card::before {
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,transparent,#00ff88,transparent);
    animation:borderShine 3s linear infinite;
}
@keyframes borderShine {
    0% { left:-100%; }
    100% { left:100%; }
}
.card h2 {
    font-size:14px;
    color:#00ff88;
    margin-bottom:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 0 15px rgba(0,255,136,0.6);
}

/* ==================== BUTTONS ==================== */
.btn-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}
.btn {
    width:100%;
    padding:16px;
    border:2px solid #00ff88;
    border-radius:12px;
    background:transparent;
    color:#00ff88;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:1.5px;
    transition:0.3s;
    text-transform:uppercase;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,255,136,0.2);
}
.btn::before {
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(0,255,136,0.3),transparent);
    transition:0.5s;
}
.btn:active::before { left:100%; }
.btn:hover {
    background:rgba(0,255,136,0.15);
    box-shadow:0 0 30px rgba(0,255,136,0.6);
    transform:translateY(-2px);
}
.btn:active { transform:scale(0.96); }

.btn-time {
    border-color:#ff8800;
    color:#ff8800;
    box-shadow:0 0 20px rgba(255,136,0,0.2);
}
.btn-time:hover {
    background:rgba(255,136,0,0.15);
    box-shadow:0 0 30px rgba(255,136,0,0.6);
}
.btn-purple {
    border-color:#aa66ff;
    color:#aa66ff;
    box-shadow:0 0 20px rgba(170,102,255,0.2);
}
.btn-purple:hover {
    background:rgba(170,102,255,0.15);
    box-shadow:0 0 30px rgba(170,102,255,0.6);
}
.btn-channel {
    border-color:#00ffcc;
    color:#00ffcc;
    box-shadow:0 0 20px rgba(0,255,204,0.3);
}
.btn-channel:hover {
    background:rgba(0,255,204,0.15);
    box-shadow:0 0 30px rgba(0,255,204,0.6);
}

/* ==================== SPEED TABS ==================== */
.speed-tabs {
    display:flex;
    gap:5px;
    margin-bottom:14px;
    background:rgba(0,0,0,0.5);
    padding:5px;
    border-radius:12px;
    border:1px solid rgba(0,255,136,0.3);
}
.speed-tab {
    flex:1;
    padding:10px 5px;
    background:transparent;
    border:none;
    color:rgba(0,255,136,0.5);
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
    font-family:inherit;
    transition:0.3s;
    letter-spacing:1px;
}
.speed-tab.active {
    background:linear-gradient(135deg,#00ff88,#00cc66);
    color:#000;
    box-shadow:0 0 20px rgba(0,255,136,0.6);
}

/* ==================== SPEED EMBED ==================== */
.speed-embed {
    background:rgba(0,0,0,0.5);
    border:2px solid rgba(0,255,136,0.4);
    border-radius:15px;
    overflow:hidden;
    margin-bottom:15px;
    position:relative;
    min-height:380px;
    box-shadow:0 0 30px rgba(0,255,136,0.2);
}
.speed-embed iframe {
    width:100%;
    height:400px;
    border:none;
    background:#fff;
    display:block;
}
.speed-embed .loading-overlay {
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.95);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:10;
    transition:opacity 0.5s;
}
.speed-embed .loading-overlay.hide {
    opacity:0;
    pointer-events:none;
}
.speed-embed .spinner {
    width:60px;
    height:60px;
    border:4px solid rgba(0,255,136,0.2);
    border-top:4px solid #00ff88;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin { 100% { transform:rotate(360deg); } }
.speed-embed .loading-text {
    margin-top:15px;
    color:#00ff88;
    font-size:13px;
    letter-spacing:2px;
    text-shadow:0 0 15px rgba(0,255,136,0.8);
}

/* ==================== LIVE GRAPH ==================== */
.live-graph {
    background:rgba(0,0,0,0.5);
    border:2px solid rgba(0,255,136,0.4);
    border-radius:14px;
    padding:12px;
    margin-bottom:14px;
    height:110px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,255,136,0.2);
}
.live-graph .bars {
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    height:100%;
    gap:2px;
}
.live-graph .bar {
    flex:1;
    background:linear-gradient(to top,#00ff88,#00ffcc);
    border-radius:3px 3px 0 0;
    min-height:2px;
    transition:height 0.3s;
    box-shadow:0 0 10px rgba(0,255,136,0.5);
}

/* ==================== CUSTOM RESULT ==================== */
.custom-result {
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:15px;
}
.result-box {
    background:rgba(0,0,0,0.5);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
    backdrop-filter:blur(10px);
    transition:0.3s;
}
.result-box .label {
    font-size:9px;
    color:#66aa88;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:1.5px;
}
.result-box .value {
    font-size:22px;
    font-weight:900;
    font-family:'Courier New',monospace;
    line-height:1;
    text-shadow:0 0 20px currentColor;
}
.result-box .unit {
    font-size:9px;
    color:#66aa88;
    margin-top:4px;
}
.result-box.dl {
    border:2px solid rgba(0,255,136,0.6);
    box-shadow:0 0 25px rgba(0,255,136,0.3);
}
.result-box.dl .value { color:#00ff88; }
.result-box.ul {
    border:2px solid rgba(0,255,204,0.6);
    box-shadow:0 0 25px rgba(0,255,204,0.3);
}
.result-box.ul .value { color:#00ffcc; }
.result-box.pg {
    border:2px solid rgba(170,102,255,0.6);
    box-shadow:0 0 25px rgba(170,102,255,0.3);
}
.result-box.pg .value { color:#aa66ff; }

/* ==================== LOG ==================== */
.log {
    background:rgba(0,0,0,0.8);
    border:2px solid rgba(0,255,136,0.3);
    border-radius:12px;
    padding:14px;
    font-size:11px;
    font-family:'Courier New',monospace;
    color:#00ff88;
    max-height:180px;
    overflow-y:auto;
    line-height:1.8;
    box-shadow:inset 0 0 30px rgba(0,255,136,0.05);
}
.log .entry {
    margin-bottom:3px;
    border-left:2px solid #00ff88;
    padding-left:10px;
}
.log .entry.error {
    color:#ff3344;
    border-left-color:#ff3344;
}
.log .entry.info {
    color:#00ffcc;
    border-left-color:#00ffcc;
}
.log .entry.warn {
    color:#ffaa00;
    border-left-color:#ffaa00;
}

/* ==================== TOAST ==================== */
.toast {
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%) translateY(150px);
    background:linear-gradient(135deg,#00ff88,#00cc66);
    color:#000;
    padding:14px 25px;
    border-radius:30px;
    font-size:14px;
    font-weight:bold;
    z-index:9999;
    transition:0.4s;
    max-width:90%;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,255,136,0.6);
    letter-spacing:1px;
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.error {
    background:linear-gradient(135deg,#ff3344,#aa0022);
    color:#fff;
    box-shadow:0 15px 50px rgba(255,51,68,0.6);
}

/* ==================== FOOTER ==================== */
.footer {
    text-align:center;
    margin-top:25px;
    padding:20px 0;
    font-size:11px;
    color:#336644;
    letter-spacing:1.5px;
    line-height:2;
}
.footer .credit {
    color:#aa66ff;
    font-weight:bold;
    text-shadow:0 0 15px rgba(170,102,255,0.8);
}
/* ==================== SCROLLBAR ==================== */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:rgba(0,0,0,0.5); }
::-webkit-scrollbar-thumb {
    background:linear-gradient(#00ff88,#00cc66);
    border-radius:3px;
}
</style>
</head>
<body>

<!-- Matrix Canvas Background -->
<canvas id="matrix"></canvas>

<!-- Grid Overlay -->
<div class="grid-overlay"></div>

<!-- Particles -->
<div id="particles"></div>

<div class="app">

    <!-- Header -->
    <div class="header">
        <h1>★ HMA VOUCHER ★</h1>
        <p>Time Check</p>
        <div class="owner">by @JackFrozt</div>

    <!-- Connect Status -->
    <div class="stat-card" id="connCard">

        <div id="customEmbed" style="display:none;">
            <button class="btn btn-purple" onclick="startCustomTest()" style="margin-bottom:14px;">🚀 START CUSTOM TEST</button>

            <div class="live-graph">
                <div class="bars" id="liveBars">
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                    <div class="bar" style="height:2px;"></div>
                </div>
            </div>

            <div class="custom-result">
                <div class="result-box dl">
                    <div class="label">⬇ DOWN</div>
                    <div class="value" id="customDownload">0</div>
                    <div class="unit">Mbps</div>
                </div>
                <div class="result-box ul">
                    <div class="label">⬆ UP</div>
                    <div class="value" id="customUpload">0</div>
                    <div class="unit">Mbps</div>
                </div>
                <div class="result-box pg">
                    <div class="label">🏓 PING</div>
                    <div class="value" id="customPing">--</div>
                    <div class="unit">ms</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Log -->
    <div class="card">
        <h2>📝 Activity Log</h2>
        <div class="log" id="log"></div>
    </div>
    <!-- Footer -->
    <div class="footer">
        © 2025 HMA VOUCHER TIME CHECK<br>
        <span class="credit">by @JackFrozt</span>

</div>

<div class="toast" id="toast"></div>

<script>
let isOnline = navigator.onLine;
let customTestRunning = false;

const PORTAL_URL_1 = 'http://192.168.100.1/';
const TIME_CHECK_URL = 'http://10.44.77.240:2060';
const CHANNEL_URL = 'https://t.me/R33AL_Bypass';

// ==================== MATRIX BACKGROUND ====================
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*/=%"\'#&_(),.;:?!\\|{}<>[]^~';
const charArray = chars.split('');
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
const drops = [];

for (let x = 0; x < columns; x++) {
    drops[x] = Math.random() * canvas.height / fontSize;
}

function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
        const text = charArray[Math.floor(Math.random() * charArray.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        const rand = Math.random();
        if (rand > 0.98) {
            ctx.fillStyle = '#ffffff';
        } else if (rand > 0.9) {
            ctx.fillStyle = '#aaffcc';
        } else {
            ctx.fillStyle = '#00ff88';
        }

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(drawMatrix, 50);

// ==================== PARTICLES ====================
function createParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    p.style.width = p.style.height = (3 + Math.random() * 5) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 20000);
}
for (let i = 0; i < 15; i++) {
    setTimeout(createParticle, i * 500);
}
setInterval(createParticle, 2000);

// ==================== INIT ====================
window.addEventListener('load', () => {
    updateStatus();
    addLog('HMA Voucher initialized', 'info');
    addLog('Line Cut: ' + PORTAL_URL_1, 'info');
    addLog('Time Check: ' + TIME_CHECK_URL, 'info');
    addLog('Channel: ' + CHANNEL_URL, 'info');
    loadFastCom();

    console.log('%c★ HMA VOUCHER TIME CHECK ★', 'color:#00ff88;font-size:26px;font-weight:900;text-shadow:0 0 20px #00ff88;');
    console.log('%cby @JackFrozt', 'color:#aa66ff;font-weight:bold;');
});

window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);

function updateStatus() {
    isOnline = navigator.onLine;
    const connText = document.getElementById('connText');
    const connCard = document.getElementById('connCard');
    if (isOnline) {
        connText.textContent = '✅ Online';
        connCard.className = 'stat-card online';
    } else {
        connText.textContent = '❌ Offline';
        connCard.className = 'stat-card offline';
    }
}

function addLog(msg, type) {
    const log = document.getElementById('log');
    if (!log) return;
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    const entry = document.createElement('div');
    entry.className = 'entry' + (type ? ' ' + type : '');
    entry.textContent = '[' + time + '] ' + msg;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
    if (log.children.length > 50) log.removeChild(log.firstChild);
}

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast';
    if (type) toast.classList.add(type);
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}
// ==================== LINE CUT ====================
function cutLine1() {
    addLog('Line Cut: ' + PORTAL_URL_1, 'info');
    showToast('📡 Opening Line Cut...');
    setTimeout(() => {
        try { window.location.href = PORTAL_URL_1; }
        catch (e) { showToast('❌ Failed', 'error'); }
    }, 300);
}

function timeCheck() {
    addLog('Time Check: ' + TIME_CHECK_URL, 'info');
    showToast('⏰ Opening Time Check...');
    setTimeout(() => {
        try { window.location.href = TIME_CHECK_URL; }
        catch (e) { showToast('❌ Failed', 'error'); }
    }, 300);
}

// ==================== CHANNEL ====================
function openChannel() {
    addLog('Channel: ' + CHANNEL_URL, 'info');
    showToast('📢 Opening Channel...');
    setTimeout(() => {
        try { window.location.href = CHANNEL_URL; }
        catch (e) { showToast('❌ Failed', 'error'); }
    }, 300);
}

// ==================== SPEED TABS ====================
function switchSpeedTab(tab) {
    document.querySelectorAll('.speed-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('fastEmbed').style.display = 'none';
    document.getElementById('customEmbed').style.display = 'none';

    if (tab === 'fast') {
        document.getElementById('fastEmbed').style.display = 'block';
        loadFastCom();
    } else {
        document.getElementById('customEmbed').style.display = 'block';
    }
    addLog('Tab: ' + tab, 'info');
}

// ==================== FAST.COM ====================
function loadFastCom() {
    const iframe = document.getElementById('fastIframe');
    const loading = document.getElementById('fastLoading');
    const fastUrl = 'https://fast.com/';

    if (iframe.src !== fastUrl) {
        loading.classList.remove('hide');
        iframe.src = fastUrl;
        iframe.onload = () => setTimeout(() => loading.classList.add('hide'), 500);
        iframe.onerror = () => loading.classList.add('hide');
        setTimeout(() => loading.classList.add('hide'), 10000);
    } else {
        loading.classList.add('hide');
    }
}

// ==================== LIVE GRAPH ====================
function updateLiveGraph(speed) {
    const bars = document.getElementById('liveBars').children;
    const maxSpeed = 100;
    const height = Math.min((speed / maxSpeed) * 100, 100);
    for (let i = 0; i < bars.length - 1; i++) {
        bars[i].style.height = bars[i + 1].style.height;
    }
    bars[bars.length - 1].style.height = Math.max(height, 2) + '%';
}

function resetLiveGraph() {
    const bars = document.getElementById('liveBars').children;
    for (let b of bars) b.style.height = '2px';
}

// ==================== CUSTOM TEST ====================
async function startCustomTest() {
    if (customTestRunning) { showToast('Running...', 'error'); return; }
    customTestRunning = true;
    showToast('Testing...');
    addLog('Custom Test started', 'info');
    resetLiveGraph();

    const dEl = document.getElementById('customDownload');
    const uEl = document.getElementById('customUpload');
    const pEl = document.getElementById('customPing');

    dEl.textContent = '0';
    uEl.textContent = '0';
    pEl.textContent = '--';

    // PING
    const pingTimes = [];
    for (let i = 0; i < 5; i++) {
        const start = performance.now();
        try {
            await fetch('https://www.google.com/generate_204?t=' + Date.now(), {
                method: 'HEAD', mode: 'no-cors', cache: 'no-cache'
            });
        } catch (e) {}
        pingTimes.push(performance.now() - start);
        await new Promise(r => setTimeout(r, 100));
    }
    const avgPing = Math.round(pingTimes.reduce((a,b) => a+b, 0) / pingTimes.length);
    pEl.textContent = avgPing;
    addLog('Ping: ' + avgPing + 'ms', 'info');
    // DOWNLOAD
    let maxD = 0;
    const dlTests = [
        { url: 'https://speed.cloudflare.com/__down?bytes=10000000', sizeMB: 10, name: '10MB' },
        { url: 'https://speed.cloudflare.com/__down?bytes=25000000', sizeMB: 25, name: '25MB' },
        { url: 'https://speed.cloudflare.com/__down?bytes=50000000', sizeMB: 50, name: '50MB' }
    ];

    for (let t of dlTests) {
        const start = performance.now();
        try {
            const c = new AbortController();
            setTimeout(() => c.abort(), 20000);
            await fetch(t.url + '&t=' + Date.now(), {
                mode: 'no-cors', cache: 'no-cache', signal: c.signal
            });
        } catch (e) {}
        const dur = (performance.now() - start) / 1000;
        if (dur > 0.3) {
            const speed = (t.sizeMB * 8) / dur;
            if (speed > maxD) maxD = speed;
            dEl.textContent = speed.toFixed(1);
            updateLiveGraph(speed);
            addLog('Download ' + t.name + ': ' + speed.toFixed(2) + ' Mbps', 'info');
        }
        await new Promise(r => setTimeout(r, 200));
    }

    // UPLOAD
    let maxU = 0;
    for (let size of [1, 5, 10]) {
        const start = performance.now();
        try {
            const bytes = size * 1024 * 1024;
            const data = new Uint8Array(bytes);
            for (let j = 0; j < bytes; j += 1024) data[j] = Math.random() * 256;
            const blob = new Blob([data], { type: 'application/octet-stream' });
            const c = new AbortController();
            setTimeout(() => c.abort(), 20000);
            await fetch('https://speed.cloudflare.com/__up', {
                method: 'POST', body: blob, mode: 'no-cors', signal: c.signal
            });
        } catch (e) {}
        const dur = (performance.now() - start) / 1000;
        if (dur > 0.3) {
            const speed = (size * 8) / dur;
            if (speed > maxU) maxU = speed;
            uEl.textContent = speed.toFixed(1);
            updateLiveGraph(speed);
            addLog('Upload ' + size + 'MB: ' + speed.toFixed(2) + ' Mbps', 'info');
        }
        await new Promise(r => setTimeout(r, 200));
    }

    addLog('Test Complete: D=' + maxD.toFixed(1) + ' U=' + maxU.toFixed(1) + ' P=' + avgPing, 'info');
    showToast('✅ Test Complete');
    customTestRunning = false;
}
